# One-command on-prem deploy:  docker compose up -d --build
# Server-side update later:    ./update.sh
# Then open http://localhost:3000
services:
  lidlr:
    build: .
    container_name: lidlr
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - lidlr-data:/app/data
    environment:
      DATABASE_URL: file:/app/data/lidlr.db
      # Weekly full crawl + daily tracking evaluation run inside the container by default.
      # Set to "1" to disable the scheduler and drive crawls yourself.
      SCHEDULER_DISABLED: ""
      # Auto-translate product titles (12 target languages supported by the
      # translation endpoint; default target is English).
      AUTO_TRANSLATE: "${AUTO_TRANSLATE:-1}"
      TRANSLATE_TARGET: "${TRANSLATE_TARGET:-en}"
      # Session signing secret. Leave empty to auto-generate and persist one
      # in the data volume, or set your own random string.
      AUTH_SECRET: "${AUTH_SECRET:-}"
      # Email for login codes + notifications: set SMTP_* (your own mail server)
      # or RESEND_API_KEY (resend.com). With neither, codes are shown in the UI.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      ALERT_FROM_EMAIL: "${ALERT_FROM_EMAIL:-}"
      SITE_URL: "${SITE_URL:-http://localhost:3000}"
      # Protects POST /api/crawl and POST /api/leaflets when set:
      CRAWL_SECRET: "${CRAWL_SECRET:-}"
      # Leaflet archive: store PDF copies of each country's weekly flyer in the data volume
      # (set to "0" to keep covers/metadata only).
      ARCHIVE_LEAFLET_PDF: "${ARCHIVE_LEAFLET_PDF:-1}"
      # Skip evergreen long-dated catalogs; only weekly-leaflets get archived
      LEAFLET_MAX_VALIDITY_DAYS: "${LEAFLET_MAX_VALIDITY_DAYS:-45}"
      # Refuse PDFs larger than this (MB)
      LEAFLET_MAX_PDF_MB: "${LEAFLET_MAX_PDF_MB:-60}"

volumes:
  lidlr-data:
